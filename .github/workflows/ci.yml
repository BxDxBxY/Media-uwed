name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    # The build only needs a reachable database URL for `prisma generate`; migrations
    # are exercised separately below against a real Postgres.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: media_uwed_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/media_uwed_ci?schema=public
      # Build-time placeholders; no real secrets are needed to compile.
      ADMIN_SESSION_SECRET: ci-session-secret-not-used-in-production
      ADMIN_SECRET_ENCRYPTION_KEY: ci-encryption-key-not-used-in-production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: AI pipeline smoke check
        run: npm run check:ai

      - name: Migrations reproduce the schema
        run: |
          npx prisma migrate deploy
          # Fails if prisma/schema.prisma has drifted away from the migration history.
          npx prisma migrate diff \
            --from-config-datasource \
            --to-schema prisma/schema.prisma \
            --exit-code

      - name: Production build
        run: npx next build
