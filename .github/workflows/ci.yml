name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    # The build only needs a reachable database URL for `prisma generate`; migrations
    # are exercised separately below against a real Postgres.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: media_uwed_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/media_uwed_ci?schema=public
      # Build-time placeholders; no real secrets are needed to compile.
      ADMIN_SESSION_SECRET: ci-session-secret-not-used-in-production
      ADMIN_SECRET_ENCRYPTION_KEY: ci-encryption-key-not-used-in-production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Every offline suite runs as its own step so a failure names itself in the CI log
      # rather than hiding inside an aggregate command.
      - name: AI pipeline checks
        run: npm run check:ai

      - name: RSS ingestion checks
        run: npm run check:rss

      - name: Topical triage checks
        run: npm run check:triage

      - name: Security primitive checks
        run: npm run check:security

      - name: Migrations reproduce the schema
        run: |
          npx prisma migrate deploy
          # Fails if prisma/schema.prisma has drifted away from the migration history.
          npx prisma migrate diff \
            --from-config-datasource \
            --to-schema prisma/schema.prisma \
            --exit-code

      # Needs the schema, so it runs after migrations. On a fresh CI database no Telegram
      # integration row exists, so the script's own refusal guard stays out of the way.
      - name: Publish behaviour checks
        run: npm run check:publish

      - name: Production build
        run: npx next build

      # The authorization guarantees are the ones worth failing a pull request over: the
      # original audit found content CRUD and the pipeline endpoints open to anonymous
      # callers. Running this against the built app means a removed guard cannot merge.
      - name: Authorization checks against the built app
        run: |
          npx next start &
          server_pid=$!
          trap "kill $server_pid" EXIT

          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:3000/api/health; then break; fi
            sleep 1
          done

          npm run check:routes
        env:
          BASE_URL: http://localhost:3000
